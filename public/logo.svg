<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="badge" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d92ef" />
      <stop offset="1" stop-color="#005a99" />
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="92" height="92" rx="24" fill="#007acc" opacity="0.45" filter="url(#glow)" />
  <rect x="14" y="14" width="92" height="92" rx="24" fill="url(#badge)" />
  <rect x="14.75" y="14.75" width="90.5" height="90.5" rx="23.25" stroke="#7ee2ff" stroke-opacity="0.25" stroke-width="1.5" />

  <text x="60" y="78" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
</svg>
